name = "rss-prism-licensing"
main = "src/index.js"
compatibility_date = "2026-10-11"

# The default Worker intentionally has no D1 binding. Licensing deployment is
# restricted to the explicitly configured staging environment below.

# Staging is deliberately isolated from the default Worker and database binding.
[env.staging]
name = "rss-prism-licensing-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "rss-prism-licensing-staging"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
