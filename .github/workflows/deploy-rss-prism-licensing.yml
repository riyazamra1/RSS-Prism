name: Deploy RSS Prism Licensing Worker

on:
  workflow_dispatch:
    inputs:
      confirm_staging_deploy:
        description: "Type DEPLOY-STAGING to deploy the licensing foundation"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: \${{ inputs.confirm_staging_deploy == 'DEPLOY-STAGING' }}
    runs-on: ubuntu-latest
    environment: rss-prism-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify deployment secrets exist
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RSS_PRISM_D1_DATABASE_ID: \${{ secrets.RSS_PRISM_D1_DATABASE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$RSS_PRISM_D1_DATABASE_ID" || { echo "Missing RSS_PRISM_D1_DATABASE_ID secret"; exit 1; }
          test "$RSS_PRISM_D1_DATABASE_ID" != "REPLACE_WITH_D1_DATABASE_ID" || exit 1
      - name: Configure Worker for the selected D1 database
        env:
          RSS_PRISM_D1_DATABASE_ID: \${{ secrets.RSS_PRISM_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$RSS_PRISM_D1_DATABASE_ID/" licensing/worker/wrangler.toml
          grep -Fq "$RSS_PRISM_D1_DATABASE_ID" licensing/worker/wrangler.toml
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Apply D1 schema to staging
        working-directory: licensing/worker
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute rss-prism-licensing-staging --remote --env staging --file=schema.sql --config=wrangler.toml
      - name: Ensure the Payments.lk purchaser-email migration is applied
        working-directory: licensing/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if ! wrangler d1 execute rss-prism-licensing-staging --remote --env staging --command "PRAGMA table_info(orders)" --json --config=wrangler.toml | grep -q "customer_email"; then
            wrangler d1 execute rss-prism-licensing-staging --remote --env staging --file=migrations/0002_payments_lk_customer_email.sql --config=wrangler.toml
          fi
      - name: Expand webhook status constraint for atomic processing
        working-directory: licensing/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          schema_sql="$(wrangler d1 execute rss-prism-licensing-staging --remote --env staging --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='payment_webhook_events'" --json --config=wrangler.toml)"
          if ! printf '%s' "$schema_sql" | grep -q "'processing'"; then
            wrangler d1 execute rss-prism-licensing-staging --remote --env staging --file=migrations/0004_allow_processing_webhook_status.sql --config=wrangler.toml
          fi
      - name: Deploy licensing Worker
        working-directory: licensing/worker
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --env staging --config=wrangler.toml
      - name: Deployment reminder
        run: |
          echo "Open the Worker URL printed by Wrangler and visit /health."
          echo "No licences are issued by this foundation; checkout remains disabled until payment integration is configured."