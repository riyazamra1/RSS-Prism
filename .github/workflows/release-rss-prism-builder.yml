name: Build and publish RSS Prism Builder release

on:
  push:
    branches: [main]
    paths:
      - 'products/rss-prism-builder/**'
      - '.github/workflows/release-rss-prism-builder.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing builder release tag (for example rss-prism-builder-v0.18.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Determine release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*\\* Version: *//p' products/rss-prism-builder/rss-prism-builder.php | head -n1)"
          TAG="rss-prism-builder-v${VERSION}"
          if [[ "${GITHUB_REF}" != "refs/heads/main" && -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
            VERSION="${TAG#rss-prism-builder-v}"
          fi
          [[ "$TAG" == rss-prism-builder-v* ]]
          [[ "$VERSION" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          grep -Fq "* Version: $VERSION" products/rss-prism-builder/rss-prism-builder.php
          grep -Fq "define( 'RSS_PRISM_BUILDER_VERSION', '$VERSION' );" products/rss-prism-builder/rss-prism-builder.php
          test -f products/rss-prism-builder/includes/auto-updates.php
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Validate and build installable plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          find products/rss-prism-builder -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done
          node --check products/rss-prism-builder/assets/builder.js
          mkdir -p dist/rss-prism-builder
          cp -a products/rss-prism-builder/. dist/rss-prism-builder/
          cd dist
          zip -qr ../rss-prism-builder.zip rss-prism-builder -x '*/.git/*' '*/node_modules/*' '*/vendor/*' '*/.DS_Store'
          unzip -t ../rss-prism-builder.zip
          unzip -l ../rss-prism-builder.zip | grep -Fq 'rss-prism-builder/rss-prism-builder.php'
          unzip -l ../rss-prism-builder.zip | grep -Fq 'rss-prism-builder/includes/auto-updates.php'
          unzip -p ../rss-prism-builder.zip rss-prism-builder/rss-prism-builder.php | grep -Fq "* Version: $VERSION"
          # The updater accepts only this exact tag and asset URL shape.
          [[ "$RELEASE_TAG" == "rss-prism-builder-v$VERSION" ]]
          echo "Validated install package: rss-prism-builder.zip ($VERSION; $RELEASE_TAG)"

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: RSS Prism Builder ${{ env.VERSION }}
          generate_release_notes: true
          overwrite_files: true
          files: rss-prism-builder.zip
