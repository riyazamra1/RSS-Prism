name: Build and publish RSS Prism theme release

on:
  push:
    tags:
      - 'rss-prism-theme-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package, e.g. rss-prism-theme-v1.2.2
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate version and theme files
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#rss-prism-theme-v}"
          [[ "$TAG" == rss-prism-theme-v* ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          grep -q "Version: $VERSION" products/rss-prism-theme/style.css
          test -f products/rss-prism-theme/functions.php
          test -f products/rss-prism-theme/inc/auto-updates.php
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build installable theme ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/rss-prism-theme
          cp -a products/rss-prism-theme/. dist/rss-prism-theme/
          cd dist
          zip -qr ../rss-prism-theme.zip rss-prism-theme
          unzip -t ../rss-prism-theme.zip

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: RSS Prism Theme ${{ env.VERSION }}
          generate_release_notes: true
          files: rss-prism-theme.zip
