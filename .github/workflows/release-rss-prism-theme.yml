name: Build and publish RSS Prism theme release

on:
  push:
    branches:
      - main
    paths:
      - 'products/rss-prism-theme/**'
      - '.github/workflows/release-rss-prism-theme.yml'
    tags:
      - 'rss-prism-theme-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package (for example rss-prism-theme-v1.2.2)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Determine release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            VERSION="$(sed -n 's/^Version: *//p' products/rss-prism-theme/style.css | head -n1)"
            TAG="rss-prism-theme-v${VERSION}"
          else
            TAG="${{ github.event.inputs.tag || github.ref_name }}"
            VERSION="${TAG#rss-prism-theme-v}"
          fi
          [[ "$TAG" == rss-prism-theme-v* ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          grep -q "^Version: $VERSION$" products/rss-prism-theme/style.css
          STABLE_TAG="$(sed -n 's/^Stable tag: *//p' products/rss-prism-theme/readme.txt | head -n1)"
          test "$VERSION" = "$STABLE_TAG"
          test -f products/rss-prism-theme/functions.php
          test -f products/rss-prism-theme/inc/auto-updates.php
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check whether this release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable theme ZIP
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --width=1200 --height=900 --output=products/rss-prism-theme/screenshot.png products/rss-prism-theme/screenshot.svg
          test -s products/rss-prism-theme/screenshot.png
          mkdir -p dist/rss-prism-theme
          cp -a products/rss-prism-theme/. dist/rss-prism-theme/
          cd dist
          zip -qr ../rss-prism-theme.zip rss-prism-theme
          unzip -t ../rss-prism-theme.zip

      - name: Publish release asset
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: RSS Prism Theme ${{ env.VERSION }}
          generate_release_notes: true
          files: rss-prism-theme.zip
