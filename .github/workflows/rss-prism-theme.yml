name: RSS Prism Theme and Builder Packages

on:
  push:
    branches: [main]
    paths:
      - "products/rss-prism-theme/**"
      - "products/rss-prism-builder/**"
      - ".github/workflows/rss-prism-theme.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none

      - name: Validate theme and builder PHP files
        shell: bash
        run: |
          set -euo pipefail
          find products/rss-prism-theme products/rss-prism-builder -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done

      - name: Validate builder JavaScript
        run: node --check products/rss-prism-builder/assets/builder.js

      - name: Check responsive previews, published output, and updater safeguards
        shell: bash
        run: |
          set -euo pipefail
          CSS=products/rss-prism-builder/assets/builder.css
          PHP=products/rss-prism-builder/rss-prism-builder.php
          UPDATER=products/rss-prism-builder/includes/auto-updates.php
          grep -Fq '.rss-prism-preview-tablet .rss-prism-live-columns' "$CSS"
          grep -Fq '.rss-prism-preview-mobile .rss-prism-live-columns' "$CSS"
          grep -Fq "add_shortcode( 'rss_prism_canvas', 'rss_prism_builder_render_canvas_shortcode' );" "$PHP"
          grep -Fq 'rss-prism-canvas-columns .rss-prism-columns-grid{grid-template-columns:1fr!important}' "$PHP"
          grep -Fq "version_compare( self::current_version(), \$release['version'], '<' )" "$UPDATER"
          grep -Fq "'/riyazamra1/RSS-Prism/releases/download/' . \$tag . '/rss-prism-builder.zip'" "$UPDATER"
          grep -Fq "current_user_can( 'update_plugins' )" "$UPDATER"
          grep -Fq "check_admin_referer( 'rss_prism_builder_check_updates' )" "$UPDATER"

      - name: Guard new-template starter content
        shell: bash
        run: |
          set -euo pipefail
          PHP=products/rss-prism-builder/rss-prism-builder.php
          grep -Fq "return rss_prism_builder_sanitize_layout( \$layout )" "$PHP"
          grep -Fq "'type' => 'columns'" "$PHP"
          grep -Fq "'type' => 'button'" "$PHP"
          grep -Fq "update_post_meta( \$new_id, '_rss_prism_layout'" "$PHP"
          grep -Fq "function rss_prism_builder_default_starter_layout()" "$PHP"
          grep -Fq "rss_prism_builder_default_starter_layout()" "$PHP"
          grep -Fq "update_post_meta( \$first_id, '_rss_prism_layout'" "$PHP"

      - name: Guard the welcome-screen create-template shortcut
        shell: bash
        run: |
          set -euo pipefail
          PHP=products/rss-prism-builder/rss-prism-builder.php
          grep -Fq "rss_prism_new_template' => '1'" "$PHP"
          grep -Fq "wp_nonce_url( add_query_arg" "$PHP"
          if grep -Fq "post-new.php?post_type=rss_prism_template" "$PHP"; then
            echo "::error::The welcome shortcut must open the visual builder, not the default post editor."
            exit 1
          fi

      - name: Guard Media Library selection against stale-state overwrites
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const fields = { image_url: attachment.url || '' };" products/rss-prism-builder/assets/builder.js
          grep -Fq "if (!item.alt && attachment.alt) fields.alt = attachment.alt;" products/rss-prism-builder/assets/builder.js
          grep -Fq "commitItems(items.map((entry, index) => index !== selected ? entry : { ...entry, ...fields }))" products/rss-prism-builder/assets/builder.js

      - name: Guard welcome dismissal and Studio duplicate prevention
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "admin_post_rss_prism_dismiss_welcome" products/rss-prism-theme/functions.php
          if grep -Fq "rss_prism_admin_welcome_script" products/rss-prism-theme/functions.php; then
            echo "::error::Welcome dismissal must use the native nonce-protected admin action."
            exit 1
          fi
          grep -Fq "Each header/footer element can appear only once across all rows." products/rss-prism-theme/inc/theme-studio.php
          grep -Fq "De-duplicate across rows as well as within each row before saving." products/rss-prism-theme/inc/theme-studio.php
          grep -Fq "function hasElement(type, element)" products/rss-prism-theme/assets/js/theme-studio.js
          grep -Fq 'function rss_prism_studio_render_palette($elements, $type)' products/rss-prism-theme/inc/theme-studio.php
          grep -Fq 'Add elements by category' products/rss-prism-theme/inc/theme-studio.php
          grep -Fq "rss_prism_navigation_controls" products/rss-prism-theme/functions.php
          grep -Fq "rss_prism_footer_layout" products/rss-prism-theme/functions.php
          grep -Fq "Set logo placement and size, header layout and surface" products/rss-prism-theme/functions.php
          grep -Fq "Footer Layout & Visibility" products/rss-prism-theme/functions.php
          grep -Fq "Navigation & Menu Typography" products/rss-prism-theme/functions.php
          grep -Fq '.rp-studio-palette-group' products/rss-prism-theme/assets/css/theme-studio.css

      - name: Check source performance budgets
        shell: bash
        run: |
          set -euo pipefail
          check_budget() {
            local file="$1" max_bytes="$2" actual
            actual="$(wc -c < "$file")"
            echo "$file: $actual bytes (limit $max_bytes)"
            if [ "$actual" -gt "$max_bytes" ]; then
              echo "::error file=$file::Performance budget exceeded ($actual > $max_bytes bytes)"
              exit 1
            fi
          }
          check_budget products/rss-prism-theme/style.css 30000
          check_budget products/rss-prism-theme/assets/js/navigation.js 1500
          check_budget products/rss-prism-builder/assets/builder.js 55000
          check_budget products/rss-prism-builder/assets/builder.css 14000
          check_budget products/rss-prism-builder/assets/pricing.css 2000
          grep -q "wp_script_add_data( 'rss-prism-navigation', 'strategy', 'defer' )" products/rss-prism-theme/functions.php
          grep -q "prefers-reduced-motion: reduce" products/rss-prism-theme/style.css

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^Theme Name: RSS Prism$' products/rss-prism-theme/style.css
          THEME_VERSION="$(sed -n 's/^Version: *//p' products/rss-prism-theme/style.css | head -n1)"
          THEME_STABLE_TAG="$(sed -n 's/^Stable tag: *//p' products/rss-prism-theme/readme.txt | head -n1)"
          test -n "$THEME_VERSION"
          test "$THEME_VERSION" = "$THEME_STABLE_TAG"
          BUILDER_VERSION="$(sed -n 's/^[[:space:]]*\* Version: *//p' products/rss-prism-builder/rss-prism-builder.php | head -n1)"
          BUILDER_STABLE_TAG="$(sed -n 's/^Stable tag: *//p' products/rss-prism-builder/readme.txt | head -n1)"
          test -n "$BUILDER_VERSION"
          test "$BUILDER_VERSION" = "$BUILDER_STABLE_TAG"
          echo "BUILDER_VERSION=$BUILDER_VERSION" >> "$GITHUB_ENV"
          echo "THEME_VERSION=$THEME_VERSION" >> "$GITHUB_ENV"

      - name: Build installable ZIP packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --width=1200 --height=900 --output=products/rss-prism-theme/screenshot.png products/rss-prism-theme/screenshot.svg
          test -s products/rss-prism-theme/screenshot.png
          mkdir -p dist/rss-prism-theme dist/rss-prism-builder
          cp -a products/rss-prism-theme/. dist/rss-prism-theme/
          cp -a products/rss-prism-builder/. dist/rss-prism-builder/
          cd dist
          zip -r "rss-prism-theme-$THEME_VERSION.zip" rss-prism-theme -x '*/.git/*' '*/node_modules/*' '*/vendor/*' '*/.DS_Store'
          zip -r "rss-prism-builder-$BUILDER_VERSION.zip" rss-prism-builder -x '*/.git/*' '*/node_modules/*' '*/vendor/*' '*/.DS_Store'

      - name: Upload installable theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rss-prism-theme-${{ env.THEME_VERSION }}
          path: dist/rss-prism-theme-${{ env.THEME_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload installable builder ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rss-prism-builder-${{ env.BUILDER_VERSION }}
          path: dist/rss-prism-builder-${{ env.BUILDER_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30
