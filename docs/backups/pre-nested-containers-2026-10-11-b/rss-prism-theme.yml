name: RSS Prism Theme and Builder Packages

on:
  push:
    branches: [main]
    paths:
      - "products/rss-prism-theme/**"
      - "products/rss-prism-builder/**"
      - ".github/workflows/rss-prism-theme.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none

      - name: Validate theme and builder PHP files
        shell: bash
        run: |
          set -euo pipefail
          find products/rss-prism-theme products/rss-prism-builder -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done

      - name: Validate builder JavaScript
        run: node --check products/rss-prism-builder/assets/builder.js

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^Theme Name: RSS Prism$' products/rss-prism-theme/style.css
          grep -q '^Version: 1.2.0$' products/rss-prism-theme/style.css
          grep -q '^Stable tag: 1.2.0$' products/rss-prism-theme/readme.txt
          grep -q 'Version: 0.10.0' products/rss-prism-builder/rss-prism-builder.php
          grep -q '^Stable tag: 0.10.0$' products/rss-prism-builder/readme.txt

      - name: Build installable ZIP packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/rss-prism-theme dist/rss-prism-builder
          cp -a products/rss-prism-theme/. dist/rss-prism-theme/
          cp -a products/rss-prism-builder/. dist/rss-prism-builder/
          cd dist
          zip -r rss-prism-theme-1.2.0.zip rss-prism-theme \
            -x '*/.git/*' '*/node_modules/*' '*/vendor/*' '*/.DS_Store'
          zip -r rss-prism-builder-0.10.0.zip rss-prism-builder \
            -x '*/.git/*' '*/node_modules/*' '*/vendor/*' '*/.DS_Store'

      - name: Upload installable theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rss-prism-theme-1.2.0
          path: dist/rss-prism-theme-1.2.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload installable builder ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rss-prism-builder-0.10.0
          path: dist/rss-prism-builder-0.10.0.zip
          if-no-files-found: error
          retention-days: 30
